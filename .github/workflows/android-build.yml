name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ebbinghaus-tracker/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        working-directory: ebbinghaus-tracker
        run: npm ci

      - name: Build web application
        working-directory: ebbinghaus-tracker
        run: npm run build

      - name: Sync Capacitor
        working-directory: ebbinghaus-tracker
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: ebbinghaus-tracker/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ebbinghaus-tracker/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: productivity-desk-debug-apk
          path: ebbinghaus-tracker/android/app/build/outputs/apk/debug/app-debug.apk
